# ===========================================================
# GitHub Actions Workflow: PlatformIO ESP32 Multi-Board Build
# ===========================================================
# Trigger: push ke main/master, pull request, manual dispatch
# Matrix Build: esp32dev, esp32-s3, esp32-c3
# Artifact: upload .bin firmware hasil compile
# ===========================================================

name: "🔧 PlatformIO Build - ESP32"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      board:
        description: "Board target (kosongkan untuk build semua)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - esp32dev
          - esp32-s3-devkitc-1
          - esp32-c3-devkitm-1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32dev
          - esp32-s3-devkitc-1
          - esp32-c3-devkitm-1

    name: "Build [${{ matrix.environment }}]"

    steps:
      # ---- Filter: skip board kalo manual dispatch pilih board tertentu ----
      - name: Check if this board should run
        id: check
        run: |
          INPUT_BOARD="${{ github.event.inputs.board }}"
          if [ -n "$INPUT_BOARD" ] && [ "$INPUT_BOARD" != "${{ matrix.environment }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- Checkout source code ----
      - name: Checkout repository
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4

      # ---- Cache PlatformIO (biar ga download ulang tiap run) ----
      - name: Cache PlatformIO
        if: steps.check.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ matrix.environment }}-

      # ---- Setup Python ----
      - name: Set up Python
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---- Install PlatformIO ----
      - name: Install PlatformIO
        if: steps.check.outputs.skip == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # ---- Build firmware ----
      - name: Build firmware [${{ matrix.environment }}]
        if: steps.check.outputs.skip == 'false'
        run: |
          pio run -e ${{ matrix.environment }}

      # ---- Upload .bin artifact ----
      - name: Upload firmware artifact
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/*.bin
          retention-days: 30
          if-no-files-found: warn
