; =============================================================
; PlatformIO Configuration - ESP32 Multi-Board Project
; =============================================================
; Tambah/hapus environment sesuai board yang lu pake.
; Library dependencies diatur di [env] supaya shared ke semua board.
; =============================================================

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit BusIO@^1.16.2

; ---------- ESP32 DevKit V1 (paling umum) ----------
[env:esp32dev]
platform = espressif32
board = esp32dev

; ---------- ESP32-S3 DevKitC ----------
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags = -DARDUINO_USB_MODE=1

; ---------- ESP32-C3 DevKitM ----------
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
